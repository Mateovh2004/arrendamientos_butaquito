<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nuevo Inventario - Arrendamientos Butaquito</title>

<style>
        body {
            background-color: #f8f9fa; /* Base Layer */
        }
        .form-shadow {
            box-shadow: 0px 4px 12px rgba(15, 76, 92, 0.05); /* Tinted subtle shadow */
        }
        .focus-glow:focus-within {
            box-shadow: 0 0 0 4px rgba(15, 76, 92, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background antialiased min-h-screen flex flex-col pt-16 md:pt-16 pb-20 md:pb-0">
<!-- TopAppBar (Web & Mobile) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-16 bg-surface dark:bg-inverse-surface shadow-sm">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-variant active:scale-95 duration-150 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-inverse-primary tracking-tight">Nuevo Inventario</h1>
</div>
<div class="flex items-center">
<!-- Trailing avatar omitted for transactional page simplicity, or replaced with close -->
<button class="text-on-surface-variant hover:bg-surface-variant active:scale-95 duration-150 p-2 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-stack-lg w-full max-w-3xl mx-auto">
<div class="w-full bg-surface-container-lowest rounded-xl border border-outline-variant p-6 md:p-8 form-shadow">
<div class="mb-8">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Configuración de Inventario</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Selecciona un inmueble y define los detalles para comenzar la inspección.</p>
</div>
<form class="flex flex-col gap-stack-lg">
<!-- Property Selection -->
<div class="flex flex-col gap-stack-sm focus-glow transition-shadow rounded-lg">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="property">INMUEBLE</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="search">search</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="property" placeholder="Buscar dirección o referencia..." required="" type="text"/>
</div>
</div>
<!-- Date Selection -->
<div class="flex flex-col gap-stack-sm focus-glow transition-shadow rounded-lg">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="date">FECHA DE INSPECCIÓN</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="date" required="" type="date"/>
</div>
</div>
<!-- Inventory Type (Segmented Control style) -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1">TIPO DE INVENTARIO</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="inventory_type" type="radio" value="entry"/>
<div class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-lg peer-checked:border-primary-container peer-checked:bg-[#b6ebfe] peer-checked:text-on-primary-fixed transition-colors">
<span class="material-symbols-outlined mb-2" data-icon="login">login</span>
<span class="font-button-text text-button-text">Entrada (Move-in)</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="inventory_type" type="radio" value="exit"/>
<div class="flex flex-col items-center justify-center p-4 border border-outline-variant rounded-lg peer-checked:border-secondary-container peer-checked:bg-secondary-fixed peer-checked:text-on-secondary-fixed transition-colors">
<span class="material-symbols-outlined mb-2" data-icon="logout">logout</span>
<span class="font-button-text text-button-text">Salida (Move-out)</span>
</div>
</label>
</div>
</div>
<!-- Additional Notes (Optional) -->
<div class="flex flex-col gap-stack-sm focus-glow transition-shadow rounded-lg mt-4">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase ml-1" for="notes">NOTAS DE REFERENCIA (OPCIONAL)</label>
<textarea class="w-full p-4 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" id="notes" placeholder="Añade contexto inicial..." rows="3"></textarea>
</div>
<!-- Submit Action -->
<div class="pt-6 mt-4 border-t border-surface-variant flex justify-end">
<button class="w-full md:w-auto bg-[#E36414] hover:bg-[#c95911] text-white font-button-text text-button-text py-3 px-8 rounded-lg shadow-sm active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="button">
                        Continuar a Espacios
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- Navigation omitted as per Semantic Shell Mandate: 
         "Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow."
         This is a transactional "Create" flow.
    -->
</body></html>
