<script>
        // Simple script to handle recipient toggle visually
        document.querySelectorAll('.grid-cols-3 button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all
                document.querySelectorAll('.grid-cols-3 button').forEach(b => {
                    b.className = 'border border-outline-variant bg-surface text-on-surface rounded-lg py-2 font-button-text text-button-text text-center hover:bg-surface-variant transition-colors';
                });
                // Set active
                this.className = 'border border-primary-container bg-primary-container text-on-primary-container rounded-lg py-2 font-button-text text-button-text text-center transition-colors';
            });
        });
